<body>

<!-- ========================================================= -->
<!-- ANIMOWANE TŁO -->
<!-- ========================================================= -->

<div
    style="
        width: 100%;
        height: 500px;
        background-color: rgb(72, 161, 106);
    "
>

    <canvas
        id="bg"
        style="
            position: relative;
            width: 100%;
            height: 100%;

            -webkit-mask-image:
                linear-gradient(
                    to bottom,
                    #000 calc(100% - 60px),
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to bottom,
                    #000 calc(100% - 60px),
                    transparent 100%
                );
        "
    ></canvas>


    <script type="module">

        import {
            createShader
        } from 'https://esm.sh/shaders/js';


        await createShader(
            document.getElementById('bg'),
            {

                components: [

                    {
                        type: 'SolidColor',

                        props: {
                            color: '#149941'
                        }
                    },


                    {
                        type: 'TimeTrail',

                        props: {

                            trailSource: 'motion',

                            trailLength: 0,

                            diffusion: 0.1,

                            trailOpacity: 0.4,

                            trailBlend: 'normal',

                            speed: 4

                        },


                        children: [

                            {

                                type: 'ContourLines',

                                props: {

                                    levels: 0.9,

                                    gamma: 1,

                                    lineWidth: 1.75,

                                    softness: 0.4,

                                    colorMode: 'custom',

                                    lineColor: '#5cdb79',

                                    backgroundColor: 'transparent'

                                },


                                children: [

                                    {

                                        type: 'PerlinNoise',

                                        props: {

                                            scale: 2.3,

                                            seed: 0,

                                            speed: 0.15

                                        }

                                    },


                                    {

                                        type: 'Blob',

                                        props: {

                                            colorA: '#666666',

                                            colorB: '#666666',

                                            size: 0.1,

                                            deformation: 0.75,

                                            softness: 0.4,

                                            highlightIntensity: 0,

                                            speed: 1,

                                            seed: 4,


                                            center: {

                                                type: 'mouse-position',

                                                smoothing: 0.3,

                                                momentum: 0.25

                                            },


                                            blendMode: 'normal'

                                        }

                                    }

                                ]

                            }

                        ]

                    }

                ]

            }
        );

    </script>

</div>


<!-- ========================================================= -->
<!-- GALERIA -->
<!-- ========================================================= -->

<div class="sekcja">

    <h1>Galeria</h1>

    <p class="podpis">
        Zobacz zdjęcia naszej szklarni,
        projektu oraz wykonanych prac.
    </p>


    <div class="galeria">


        <!-- ZDJĘCIE 1 -->

        <div class="zdjecie">

            <img
                src="zdj1.png"
                alt="Szklarnia - zdjęcie 1"
                loading="lazy"
            >

        </div>


        <!-- ZDJĘCIE 4 -->

        <div class="zdjecie">

            <img
                src="zdj4.png"
                alt="Szklarnia - zdjęcie 2"
                loading="lazy"
            >

        </div>


        <!-- ZDJĘCIE 5 -->

        <div class="zdjecie">

            <img
                src="zdj5.png"
                alt="Szklarnia - zdjęcie 3"
                loading="lazy"
            >

        </div>


        <!-- ZDJĘCIE 7 -->

        <div class="zdjecie">

            <img
                src="zdj7.png"
                alt="Szklarnia - zdjęcie 4"
                loading="lazy"
            >

        </div>


        <!-- ZDJĘCIE 8 -->

        <div class="zdjecie">

            <img
                src="zdj8.png"
                alt="Szklarnia - zdjęcie 5"
                loading="lazy"
            >

        </div>


        <!-- ZDJĘCIE 6 -->

        <div class="zdjecie">

            <img
                src="zdj6.png"
                alt="Szklarnia - zdjęcie 6"
                loading="lazy"
            >

        </div>

    </div>

</div>


<!-- ========================================================= -->
<!-- POWIĘKSZANIE ZDJĘĆ -->
<!-- ========================================================= -->

<div
    id="podgladZdjecia"
    style="
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;

        background: rgba(0,0,0,0.85);

        align-items: center;
        justify-content: center;

        padding: 30px;

        cursor: pointer;
    "
>

    <img
        id="duzeZdjecie"
        src=""
        alt="Powiększone zdjęcie"
        style="
            max-width: 95%;
            max-height: 90%;
            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5);
        "
    >

</div>


<!-- ========================================================= -->
<!-- SKRYPT GALERII -->
<!-- ========================================================= -->

<script>

const zdjecia =
    document.querySelectorAll(
        ".zdjecie img"
    );


const podglad =
    document.getElementById(
        "podgladZdjecia"
    );


const duzeZdjecie =
    document.getElementById(
        "duzeZdjecie"
    );


zdjecia.forEach(
    zdjecie => {

        zdjecie.addEventListener(
            "click",
            () => {

                duzeZdjecie.src =
                    zdjecie.src;

                duzeZdjecie.alt =
                    zdjecie.alt;

                podglad.style.display =
                    "flex";

            }
        );

    }
);


podglad.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            podglad
        ) {

            podglad.style.display =
                "none";

            duzeZdjecie.src =
                "";

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            podglad.style.display =
                "none";

            duzeZdjecie.src =
                "";

        }

    }
);

</script>


</body>
</html>
